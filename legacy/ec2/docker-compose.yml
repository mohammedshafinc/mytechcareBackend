services:
  postgres:
    image: postgres:15
    container_name: mtechcare_container
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: REPLACE_WITH_LEGACY_USER
      POSTGRES_PASSWORD: REPLACE_WITH_LEGACY_PASSWORD
      POSTGRES_DB: REPLACE_WITH_LEGACY_DATABASE
      TZ: Asia/Riyadh
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: